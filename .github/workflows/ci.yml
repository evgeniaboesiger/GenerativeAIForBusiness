name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    name: api (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  matcha-tests:
    name: matcha (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matcha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: system deps (tesseract for OCR path)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  web-build:
    name: web (next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: rm -rf .next && npm run build

  web-api-integration:
    name: web↔api proxy smoke
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: web
      - run: pip install --quiet -r requirements.txt
        working-directory: api
      - run: rm -rf .next && npm run build
        working-directory: web
      - name: start api backend
        working-directory: api
        run: nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
      - name: start next frontend
        working-directory: web
        run: nohup npm start -- --port 3000 > /tmp/web.log 2>&1 &
      - name: smoke the proxy
        run: |
          set -e
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/ >/dev/null 2>&1 && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/ >/dev/null
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/ >/dev/null 2>&1 && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/ >/dev/null
          q=$(curl -sf http://127.0.0.1:3000/api/assessment/questions | python3 -c 'import sys,json; print(len(json.load(sys.stdin)["personality_questions"]))')
          test "$q" -eq 40
          wid=$(curl -sf -X POST http://127.0.0.1:3000/api/workflows/start/1/1 | python3 -c 'import sys,json; print(json.load(sys.stdin)["workflow_id"])')
          test "${#wid}" -eq 36
          echo "proxy smoke OK ($q questions, workflow $wid)"